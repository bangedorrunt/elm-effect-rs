[package]
name = "elm-effect-elm"
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
elm-effect = { path = "../elm-effect" }
elm-effect-journal = { path = "../elm-effect-journal" }
serde = { version = "1", features = ["derive"] }
