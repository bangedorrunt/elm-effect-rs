[package]
name = "elm-effect-unstable"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[features]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk"]
eventlog = []
persistence = []
cli = []
ai = []
schema_obs = []
http = ["dep:ureq"]

[dependencies]
elm-effect = { path = "../elm-effect" }
elm-effect-schema = { path = "../elm-effect-schema" }
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", optional = true, features = ["testing"] }
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }
clap = { version = "4", default-features = false, features = ["std", "help"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
flate2 = { version = "1" }
sha2 = { version = "0.11" }
ed25519-dalek = { version = "3", features = ["pkcs8"] }
base64 = { version = "0.23" }

[dev-dependencies]
