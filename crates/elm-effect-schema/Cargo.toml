[package]
name = "elm-effect-schema"
version = "0.2.0"
edition = "2024"

[dependencies]
serde_json = "1"
thiserror = "1"

[dev-dependencies]
# No dependency on `elm-effect`: it depends on this crate, so a dev-dep back
# would make the edge run both ways. This crate's fence imports its own
# types; the re-export is tested over in `elm-effect`'s `schema_facade`.
