[package]
name = "elm-effect"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["tokio", "schema", "stm"]
tokio = ["dep:tokio"]
schema = ["dep:elm-effect-schema"]
stm = []

[dependencies]
elm-effect-schema = { path = "../elm-effect-schema", optional = true }
jiff = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
thiserror = "1"
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
