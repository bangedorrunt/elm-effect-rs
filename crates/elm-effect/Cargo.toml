[package]
name = "elm-effect"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
schema = ["dep:elm-effect-schema"]
stm = []
full = ["schema", "stm"]

# STM tests need the stm feature (no longer default: default is tokio only).
[[test]]
name = "tx_core"
required-features = ["stm"]

[[test]]
name = "tx_deferred"
required-features = ["stm"]

# The schema surface is re-exported from this crate, so its fence lives here.
[[test]]
name = "schema_facade"
required-features = ["schema"]

# TxHashSet's set algebra is behind the stm feature, so its integration test
# is too: without the gate cargo tries to build it feature-off, where
# `TxHashSet` and `atomically` are not exported, and the whole crate's test
# build fails.
[[test]]
name = "tx_hash_set_algebra"
required-features = ["stm"]

[[test]]
name = "tx_priority_queue"
required-features = ["stm"]

[dependencies]
elm-effect-schema = { path = "../elm-effect-schema", optional = true }
thiserror = "1"
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread", "sync", "time"] }

# These four are used only by test targets, which compile parts of the
# source tree through `#[path]` includes (the `data/` and `cron/` modules
# the port campaign parked). Declared as normal dependencies, cargo's
# unused-dependency lint flags each for the lib target, which never uses
# them.
[dev-dependencies]
jiff = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
